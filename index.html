<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>놀이 상자</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: a toy shelf — big hand-lettered name, then a column of game boxes; empty shelf spots wait for new games */
:root {
  --ground: #f3eefb;
  --shelf: #c8915c;
  --shelf-dark: #9c6436;
  --ink: #33283f;
  --muted: #7d7189;
  --card: #fffdfa;
  --accent: #e0507a;
  --line: rgba(51, 40, 63, .14);
  --display: 'Jua', 'Gowun Dodum', system-ui, sans-serif;
  --body: 'Gowun Dodum', system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background:
    radial-gradient(circle at 12% 8%, rgba(224, 80, 122, .10) 0 120px, transparent 121px),
    radial-gradient(circle at 92% 30%, rgba(120, 180, 150, .14) 0 90px, transparent 91px),
    var(--ground);
  color: var(--ink);
  font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40px;
  box-sizing: border-box;
}
.app { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
header { display: flex; flex-direction: column; gap: 6px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 44px; line-height: 1.05; margin: 0; letter-spacing: -1px; text-wrap: balance; }
h1 span { color: var(--accent); }
.sub { margin: 0; color: var(--muted); font-size: 15px; }

.shelf { display: flex; flex-direction: column; gap: 14px; }
.shelf-label { font-size: 12px; letter-spacing: .1em; color: var(--muted); }
.board {
  height: 12px; border-radius: 6px;
  background: linear-gradient(var(--shelf), var(--shelf-dark));
  box-shadow: 0 6px 12px rgba(51, 40, 63, .15);
}

.game {
  display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: center;
  background: var(--card); border-radius: 22px; padding: 16px;
  text-decoration: none; color: inherit;
  box-shadow: 0 2px 0 var(--line), 0 10px 22px rgba(51, 40, 63, .08);
  transition: transform .15s ease, box-shadow .15s ease;
}
.game:hover { transform: translateY(-3px); box-shadow: 0 2px 0 var(--line), 0 16px 28px rgba(51, 40, 63, .12); }
.game:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.art { width: 96px; height: 96px; border-radius: 20px; display: grid; place-items: center; background: #e9f4ee; }
.art svg { width: 84px; height: 84px; display: block; }
.info { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.info h2 { font-family: var(--display); font-weight: 400; font-size: 23px; margin: 0; }
.info p { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 2px; }
.pill { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--ground); color: var(--ink); font-variant-numeric: tabular-nums; }
.pill.go { background: var(--accent); color: var(--card); font-family: var(--display); font-size: 14px; padding: 4px 14px; }

.slot-empty {
  display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: center;
  border: 2px dashed var(--line); border-radius: 22px; padding: 14px; color: var(--muted);
}
.slot-empty .art { background: transparent; border: 2px dashed var(--line); font-family: var(--display); font-size: 30px; color: var(--line); box-sizing: border-box; }
.slot-empty h2 { font-family: var(--display); font-weight: 400; font-size: 19px; margin: 0; color: var(--muted); }

@media (max-width: 380px) {
  .game, .slot-empty { grid-template-columns: 72px 1fr; gap: 12px; }
  .art { width: 72px; height: 72px; }
  .art svg { width: 64px; height: 64px; }
}
@media (prefers-reduced-motion: reduce) { .game { transition: none; } .game:hover { transform: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>놀이 <span>상자</span></h1>
    <p class="sub">하고 싶은 게임을 골라 보세요.</p>
  </header>

  <section class="shelf" aria-label="게임 목록">
    <span class="shelf-label">게임 선반</span>
    <div id="games" class="shelf"></div>
    <div class="board" aria-hidden="true"></div>
  </section>
</div>

<script>
(() => {
  const store = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };

  // Add new games here: one entry per game folder under games/.
  const GAMES = [
    {
      name: '케이크 합치기',
      desc: '같은 케이크 조각을 옆 접시로 모아 6조각을 채우는 퍼즐. 완성할수록 테이블이 넓어져요.',
      href: 'games/cake/index.html',
      art: cakeArt(),
      best: () => +store('cake-merge-best') || 0,
      resume: () => { try { const s = JSON.parse(store('cake-merge-v2')); return !!(s && !s.over && s.board.some(Boolean)); } catch (e) { return false; } },
    },
  ];
  const EMPTY_SLOTS = 1;

  function cakeArt() {
    const cakes = [['#f6a3bf', '#d4587f'], ['#f6a3bf', '#d4587f'], ['#f6a3bf', '#d4587f'], ['#ffe07c', '#dba72a'], ['#ffe07c', '#dba72a'], ['#a9d07b', '#6c9841']];
    const pt = (d, r) => { const a = d * Math.PI / 180; return [(Math.cos(a) * r).toFixed(2), (Math.sin(a) * r).toFixed(2)]; };
    let s = '<svg viewBox="-50 -50 100 100" aria-hidden="true"><circle r="46" fill="#fff" stroke="#e7dcd6" stroke-width="2"/><circle r="40" fill="#f8f2ee"/>';
    cakes.forEach(([top, side], i) => {
      const a0 = -90 + i * 60 + 2.5, a1 = -90 + (i + 1) * 60 - 2.5, [x0, y0] = pt(a0, 37), [x1, y1] = pt(a1, 37), [tx, ty] = pt((a0 + a1) / 2, 24);
      s += `<path d="M0 0L${x0} ${y0}A37 37 0 0 1 ${x1} ${y1}Z" fill="${top}" stroke="${side}" stroke-width="2.6" stroke-linejoin="round"/><circle cx="${tx}" cy="${ty}" r="4.5" fill="${side}"/>`;
    });
    return s + '</svg>';
  }

  const list = document.getElementById('games');
  list.innerHTML = GAMES.map((g) => {
    const best = g.best();
    return `<a class="game" href="${g.href}">
      <div class="art">${g.art}</div>
      <div class="info">
        <h2>${g.name}</h2>
        <p>${g.desc}</p>
        <div class="meta">
          <span class="pill go">${g.resume() ? '이어 하기' : '시작'}</span>
          ${best ? `<span class="pill">최고 ${best.toLocaleString()}점</span>` : ''}
        </div>
      </div>
    </a>`;
  }).join('') + Array.from({ length: EMPTY_SLOTS }, () => `
    <div class="slot-empty" aria-label="빈 자리">
      <div class="art">+</div>
      <div class="info"><h2>다음 게임 자리</h2><p>새 게임을 만들면 여기에 놓여요.</p></div>
    </div>`).join('');
})();
</script>
</body>
</html>
