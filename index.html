<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>케이크 합치기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one-screen bakery table — score bar, display case of cakes, checkered tablecloth board, wooden serving tray */
:root {
  --cloth: #eaf4ee;
  --check: #d5eadf;
  --ink: #3d2c2a;
  --muted: #86706a;
  --wood: #c8915c;
  --wood-dark: #9c6436;
  --accent: #e0507a;
  --card: #fffaf7;
  --line: rgba(61, 44, 42, .14);
  --display: 'Jua', 'Gowun Dodum', system-ui, sans-serif;
  --body: 'Gowun Dodum', system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--cloth);
  color: var(--ink);
  font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  box-sizing: border-box;
  overflow-x: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.app { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 28px; margin: 0; letter-spacing: -.5px; color: var(--ink); text-wrap: balance; }
h1 span { color: var(--accent); }

.btn {
  font-family: var(--display); font-size: 15px; color: var(--ink);
  background: var(--card); border: 2px solid var(--line); border-radius: 999px;
  padding: 6px 14px; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, .switch input:focus-visible + .knob { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn.warn { background: var(--accent); color: var(--card); border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }

.stats { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; }
.stat { background: var(--card); border-radius: 14px; padding: 6px 12px; display: flex; flex-direction: column; }
.stat .lab { font-size: 11px; letter-spacing: .08em; color: var(--muted); }
.stat b { font-family: var(--display); font-weight: 400; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.15; }
.stat:first-child b { color: var(--accent); }

.case { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 12px; color: var(--muted); min-height: 18px; }
.case .chip { display: inline-flex; align-items: center; gap: 4px; }
.case .dot { width: 11px; height: 11px; border-radius: 50%; box-shadow: inset 0 -2px 0 rgba(0,0,0,.18); }
.case .chip.locked { opacity: .45; }
.case .chip.locked .dot { background: var(--line) !important; }

.board {
  position: relative;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
  padding: 10px; border-radius: 20px;
  background: repeating-conic-gradient(var(--check) 0 25%, var(--cloth) 0 50%) 0 0 / 44px 44px;
  border: 3px solid var(--card);
  box-shadow: 0 6px 0 var(--check), 0 10px 24px rgba(61,44,42,.10);
  width: min(100%, max(250px, calc((100dvh - 350px) * .8)));
  margin: 0 auto; box-sizing: border-box; touch-action: none;
}
.cell { aspect-ratio: 1; position: relative; display: grid; place-items: center; border-radius: 50%; cursor: pointer; }
.cell.empty::before {
  content: ''; position: absolute; inset: 9%; border-radius: 50%;
  border: 2px dashed var(--line); transition: background .15s, border-color .15s;
}
.cell.can::before { border-color: rgba(224, 80, 122, .35); }
.cell.hint::before { border-color: var(--accent); border-style: solid; background: rgba(224, 80, 122, .12); }
.cell svg { width: 100%; height: 100%; display: block; overflow: visible; }
.cell.glow svg { animation: wiggle .5s ease-in-out infinite alternate; filter: drop-shadow(0 0 6px rgba(255, 196, 0, .9)); }

.tray {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  padding: 10px 14px; border-radius: 18px;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 3px, transparent 3px 22px),
    linear-gradient(var(--wood), var(--wood-dark));
  box-shadow: inset 0 3px 0 rgba(255,255,255,.25), inset 0 -4px 0 rgba(0,0,0,.15), 0 6px 14px rgba(61,44,42,.18);
  width: min(100%, max(250px, calc((100dvh - 350px) * .8))); margin: 0 auto; box-sizing: border-box;
  touch-action: none;
}
.slot { aspect-ratio: 1; max-height: 92px; justify-self: center; width: 100%; display: grid; place-items: center; border-radius: 50%; cursor: grab; position: relative; border: none; background: none; padding: 0; }
.slot svg { width: 88%; height: 88%; display: block; filter: drop-shadow(0 4px 2px rgba(0,0,0,.2)); transition: transform .15s; }
.slot.sel svg { transform: translateY(-6px) scale(1.06); filter: drop-shadow(0 8px 4px rgba(0,0,0,.25)); }
.slot.sel::after { content: ''; position: absolute; inset: 2%; border-radius: 50%; border: 3px solid var(--card); }
.slot.lifting svg { opacity: .25; }
.slot.in svg { animation: slidein .35s cubic-bezier(.2,.9,.3,1.3) both; }
.slot:nth-child(2).in svg { animation-delay: .06s; }
.slot:nth-child(3).in svg { animation-delay: .12s; }

.tools { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .knob { width: 36px; height: 20px; border-radius: 999px; background: var(--line); position: relative; transition: background .2s; }
.switch .knob::after { content: ''; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--card); transition: transform .2s; }
.switch input:checked + .knob { background: var(--accent); }
.switch input:checked + .knob::after { transform: translateX(16px); }
.help { margin: 0; font-size: 12.5px; line-height: 1.55; color: var(--muted); }

.ghost { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 20; filter: drop-shadow(0 10px 6px rgba(0,0,0,.25)); }
.ghost svg, .flyer svg { width: 100%; height: 100%; display: block; overflow: visible; }
.flyer { position: fixed; pointer-events: none; z-index: 15; transition: transform .28s cubic-bezier(.4,.1,.3,1); }

.pop svg { animation: pop .5s ease-in forwards; }
.vanish svg { animation: vanish .3s ease-in forwards; }
.drop svg { animation: drop .22s ease-out; }
.bump svg { animation: bump .18s ease-out; }

.float {
  position: fixed; z-index: 25; pointer-events: none; transform: translate(-50%, -50%);
  font-family: var(--display); font-size: 22px; color: var(--accent);
  text-shadow: 0 2px 0 var(--card), 0 0 6px var(--card); white-space: nowrap;
  animation: floatup .9s ease-out forwards;
}
.float small { display: block; font-size: 14px; color: var(--ink); text-align: center; }
.spark { position: fixed; z-index: 24; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; animation: spark .6s ease-out forwards; }

.toast {
  position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--card); padding: 8px 16px; border-radius: 999px;
  font-family: var(--display); font-size: 15px; z-index: 30; white-space: nowrap; animation: toast 2.2s ease forwards;
}

.over { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(61,44,42,.45); padding: 16px; }
.over .box { background: var(--card); border-radius: 22px; padding: 24px 22px; text-align: center; width: min(320px, 100%); box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; }
.over h2 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0; }
.over p { margin: 0; color: var(--muted); }
.over .big { font-family: var(--display); font-size: 42px; color: var(--accent); font-variant-numeric: tabular-nums; }

@keyframes pop { 0% { transform: scale(1) rotate(0); } 40% { transform: scale(1.18) rotate(-8deg); } 100% { transform: scale(0) rotate(40deg); opacity: 0; } }
@keyframes vanish { to { transform: scale(.3); opacity: 0; } }
@keyframes drop { from { transform: scale(1.25); opacity: .6; } to { transform: scale(1); opacity: 1; } }
@keyframes bump { 50% { transform: scale(1.08); } }
@keyframes wiggle { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
@keyframes slidein { from { transform: translateX(60px) scale(.6); opacity: 0; } }
@keyframes floatup { 0% { opacity: 0; margin-top: 10px; } 15% { opacity: 1; } 100% { opacity: 0; margin-top: -50px; } }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
@keyframes toast { 0% { opacity: 0; margin-top: -8px; } 10%, 85% { opacity: 1; margin-top: 0; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>케이크 <span>합치기</span></h1>
    <button class="btn" id="newBtn" type="button">새 게임</button>
  </header>

  <div class="stats">
    <div class="stat"><span class="lab">점수</span><b id="score">0</b></div>
    <div class="stat"><span class="lab">최고</span><b id="best">0</b></div>
    <div class="stat"><span class="lab">완성 케이크</span><b id="clears">0</b></div>
  </div>

  <div class="case" id="case" aria-label="등장하는 케이크"></div>

  <div class="board" id="board" role="grid" aria-label="테이블"></div>

  <div class="tray" id="tray" aria-label="새 접시"></div>

  <div class="tools">
    <button class="btn" id="shuffleBtn" type="button">접시 바꾸기 · <span id="shufN">3</span></button>
    <label class="switch" for="oneSlice"><input type="checkbox" id="oneSlice"><span class="knob"></span>1조각 접시만</label>
  </div>
  <p class="help">쟁반의 접시를 테이블 빈칸으로 끌어다 놓거나, 눌러서 고른 뒤 빈칸을 누르세요. 같은 케이크가 위·아래·옆으로 붙으면 조각이 한 접시로 모이고, 6조각이 모이면 완성되어 사라져요. 판이 꽉 차면 끝!</p>
</div>

<div class="over" id="over" hidden>
  <div class="box">
    <h2>테이블이 꽉 찼어요</h2>
    <p>이번 점수</p>
    <div class="big" id="overScore">0</div>
    <p id="overNote"></p>
    <button class="btn warn" id="againBtn" type="button">다시 하기</button>
  </div>
</div>

<script>
(() => {
  const COLS = 4, ROWS = 5, N = COLS * ROWS, MAX = 6;
  const SAVE_KEY = 'cake-merge-v1', BEST_KEY = 'cake-merge-best';
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const T_FLY = RM ? 10 : 280, T_GAP = RM ? 0 : 70;

  const CAKES = [
    { name: '딸기',     top: '#f6a3bf', side: '#d4587f', dot: '#e3263f' },
    { name: '초코',     top: '#8b5a43', side: '#573224', dot: '#f3e2d2' },
    { name: '말차',     top: '#a9d07b', side: '#6c9841', dot: '#fbf5e2' },
    { name: '레몬',     top: '#ffe07c', side: '#dba72a', dot: '#8fbf3a' },
    { name: '블루베리', top: '#a698e2', side: '#6858b4', dot: '#33287a' },
    { name: '오렌지',   top: '#ffb56d', side: '#de7820', dot: '#fff2df' },
    { name: '민트초코', top: '#90e0d2', side: '#36a291', dot: '#4a2f22' },
    { name: '레드벨벳', top: '#d6485b', side: '#981d31', dot: '#fffaf6' },
  ];

  const $ = (s) => document.querySelector(s);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const rand = (n) => Math.floor(Math.random() * n);
  const weighted = (arr, w) => {
    const ws = arr.map(w), tot = ws.reduce((a, b) => a + b, 0);
    let x = Math.random() * tot;
    for (let i = 0; i < arr.length; i++) { x -= ws[i]; if (x <= 0) return arr[i]; }
    return arr[arr.length - 1];
  };
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };

  let S = null, busy = false, sel = -1, drag = null;
  const cells = [], slots = [];

  // ---------- drawing ----------
  const pt = (deg, r) => { const a = deg * Math.PI / 180; return [(Math.cos(a) * r).toFixed(2), (Math.sin(a) * r).toFixed(2)]; };
  function wedge(i, c) {
    const a0 = -90 + i * 60 + 2.5, a1 = -90 + (i + 1) * 60 - 2.5, mid = (a0 + a1) / 2, R = 37;
    const [ox, oy] = pt(mid, 1.6);
    const [x0, y0] = pt(a0, R), [x1, y1] = pt(a1, R);
    const [c0x, c0y] = pt(a0 + 4, R - 5), [c1x, c1y] = pt(a1 - 4, R - 5);
    const [tx, ty] = pt(mid, 24);
    return `<g transform="translate(${ox} ${oy})">` +
      `<path d="M0 0L${x0} ${y0}A${R} ${R} 0 0 1 ${x1} ${y1}Z" fill="${c.top}" stroke="${c.side}" stroke-width="2.6" stroke-linejoin="round"/>` +
      `<path d="M${c0x} ${c0y}A${R - 5} ${R - 5} 0 0 1 ${c1x} ${c1y}" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.4" stroke-linecap="round"/>` +
      `<circle cx="${tx}" cy="${ty}" r="5" fill="${c.dot}" stroke="${c.side}" stroke-opacity=".35"/>` +
      `<circle cx="${(+tx - 1.6).toFixed(2)}" cy="${(+ty - 1.6).toFixed(2)}" r="1.5" fill="#fff" opacity=".75"/></g>`;
  }
  function plateSVG(p) {
    let s = '<svg viewBox="-50 -50 100 100" aria-hidden="true">' +
      '<circle r="46" fill="#ffffff" stroke="#e7dcd6" stroke-width="2"/>' +
      '<circle r="40" fill="#f8f2ee"/>';
    if (p) for (let i = 0; i < p.n; i++) s += wedge(i, CAKES[p.t]);
    return s + '</svg>';
  }

  // ---------- state ----------
  function fresh(oneSlice) {
    return { board: Array(N).fill(null), tray: [null, null, null], score: 0, clears: 0, combo: 0, shuffles: 3, oneSlice: !!oneSlice, over: false };
  }
  const bestScore = () => Math.max(+store.get(BEST_KEY) || 0, S ? S.score : 0);
  const typeCount = () => Math.min(CAKES.length, 4 + Math.floor(S.clears / 6));
  const level = () => 1 + Math.floor(S.clears / 6);
  const save = () => {
    store.set(SAVE_KEY, JSON.stringify(S));
    if (S.score > (+store.get(BEST_KEY) || 0)) store.set(BEST_KEY, String(S.score));
  };
  function valid(d) {
    return d && Array.isArray(d.board) && d.board.length === N && Array.isArray(d.tray) && d.tray.length === 3 &&
      d.board.concat(d.tray).every((p) => p === null || (p && p.t >= 0 && p.t < CAKES.length && p.n >= 0 && p.n <= MAX));
  }

  const nbrs = (i) => {
    const r = Math.floor(i / COLS), c = i % COLS, out = [];
    if (r > 0) out.push(i - COLS);
    if (r < ROWS - 1) out.push(i + COLS);
    if (c > 0) out.push(i - 1);
    if (c < COLS - 1) out.push(i + 1);
    return out;
  };
  const dist = (a, b) => Math.abs(Math.floor(a / COLS) - Math.floor(b / COLS)) + Math.abs(a % COLS - b % COLS);

  function flood(start, t) {
    const seen = new Set([start]), q = [start];
    while (q.length) {
      const i = q.pop();
      for (const j of nbrs(i)) if (!seen.has(j) && S.board[j] && S.board[j].t === t) { seen.add(j); q.push(j); }
    }
    return [...seen];
  }
  function groups() {
    const seen = new Set(), out = [];
    S.board.forEach((p, i) => {
      if (!p || seen.has(i)) return;
      const g = flood(i, p.t);
      g.forEach((j) => seen.add(j));
      const empties = new Set();
      g.forEach((j) => nbrs(j).forEach((k) => { if (!S.board[k]) empties.add(k); }));
      out.push({ t: p.t, cells: g, sum: g.reduce((a, j) => a + S.board[j].n, 0), empties });
    });
    return out;
  }

  // ---------- plate generator: reads the table so the puzzle stays solvable ----------
  function genPlates(count) {
    const empties = S.board.filter((p) => !p).length;
    const pressure = 1 - empties / N;          // 0 = empty table, 1 = full
    const T = typeCount(), lvl = level();
    const present = new Set(S.board.filter(Boolean).map((p) => p.t));
    // groups that touch an empty cell can still be completed; "need" = slices missing to reach 6
    const cands = groups().filter((g) => g.empties.size > 0)
      .map((g) => ({ t: g.t, need: MAX - (g.sum % MAX || MAX), sum: g.sum, room: g.empties.size }))
      .filter((c) => c.need > 0);
    const out = [];
    let helped = 0;
    for (let k = 0; k < count; k++) {
      const live = cands.filter((c) => c.need > 0);
      const pHelp = Math.min(0.92, Math.max(0.3, 0.55 - 0.025 * (lvl - 1)) + pressure * 0.45);
      const mustHelp = k === count - 1 && helped === 0 && empties <= 7;
      if (live.length && (mustHelp || Math.random() < pHelp)) {
        // favour groups that are nearly complete and have space around them
        const c = weighted(live, (c) => (c.sum * c.sum + 1) * (1 + c.room * 0.4));
        let n = S.oneSlice ? 1 : (Math.random() < 0.6 ? c.need : 1 + rand(c.need));
        c.need -= n;
        out.push({ t: c.t, n });
        helped++;
      } else {
        const pool = [...Array(T).keys()];
        const crowded = pressure > 0.55;
        const t = weighted(pool, (t) => present.has(t) ? 3 : (crowded ? 0.2 : 1));
        const n = S.oneSlice ? 1 : weighted([1, 2, 3], (n) => [0, 0.45, 0.35, 0.2][n]);
        out.push({ t, n });
      }
    }
    for (let i = out.length - 1; i > 0; i--) { const j = rand(i + 1); [out[i], out[j]] = [out[j], out[i]]; }
    return out;
  }
  function refillTray() { S.tray = genPlates(3); }

  // ---------- rendering ----------
  function buildDom() {
    const board = $('#board'), tray = $('#tray');
    for (let i = 0; i < N; i++) {
      const el = document.createElement('div');
      el.className = 'cell empty';
      el.dataset.i = i;
      el.setAttribute('role', 'gridcell');
      el.addEventListener('click', () => onCellTap(i));
      el.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse' && sel >= 0 && !drag) setHint(i, S.tray[sel]); });
      el.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse' && sel >= 0 && !drag) setHint(-1); });
      board.appendChild(el); cells.push(el);
    }
    for (let i = 0; i < 3; i++) {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'slot';
      el.dataset.i = i;
      bindSlot(el, i);
      tray.appendChild(el); slots.push(el);
    }
  }
  function renderCell(i, anim) {
    const p = S.board[i], el = cells[i];
    el.classList.remove('glow', 'hint', 'pop', 'vanish', 'drop', 'bump');
    el.classList.toggle('empty', !p);
    el.classList.toggle('can', !p && sel >= 0);
    el.innerHTML = p ? plateSVG(p) : '';
    el.setAttribute('aria-label', p ? `${CAKES[p.t].name} ${p.n}조각` : '빈칸');
    if (anim) { void el.offsetWidth; el.classList.add(anim); }
  }
  function renderBoard() { for (let i = 0; i < N; i++) renderCell(i); }
  function renderTray(anim) {
    slots.forEach((el, i) => {
      const p = S.tray[i];
      el.classList.remove('in', 'lifting');
      el.classList.toggle('sel', sel === i);
      el.innerHTML = p ? plateSVG(p) : '';
      el.disabled = !p;
      el.setAttribute('aria-label', p ? `${CAKES[p.t].name} ${p.n}조각 접시` : '빈 자리');
      if (anim && p) { void el.offsetWidth; el.classList.add('in'); }
    });
  }
  function renderStats() {
    $('#score').textContent = S.score.toLocaleString();
    $('#best').textContent = bestScore().toLocaleString();
    $('#clears').textContent = S.clears;
    $('#shufN').textContent = S.shuffles;
    $('#shuffleBtn').disabled = S.shuffles <= 0 || S.over;
    $('#oneSlice').checked = S.oneSlice;
    const T = typeCount();
    $('#case').innerHTML = '<span>진열대</span>' + CAKES.map((c, i) => i < T
      ? `<span class="chip"><span class="dot" style="background:${c.top}"></span>${c.name}</span>`
      : `<span class="chip locked"><span class="dot"></span>?</span>`).join('');
  }
  function renderAll() { renderBoard(); renderTray(); renderStats(); $('#over').hidden = !S.over; if (S.over) fillOver(); }

  function setHint(i, plate) {
    cells.forEach((c) => c.classList.remove('hint', 'glow'));
    if (i < 0 || !plate || S.board[i]) return;
    cells[i].classList.add('hint');
    nbrs(i).forEach((j) => { if (S.board[j] && S.board[j].t === plate.t) cells[j].classList.add('glow'); });
  }

  const centerOf = (el) => { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width }; };
  function floatText(i, html) {
    const c = centerOf(cells[i]);
    const el = document.createElement('div');
    el.className = 'float'; el.innerHTML = html;
    el.style.left = c.x + 'px'; el.style.top = c.y + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 950);
  }
  function sparks(i, color) {
    if (RM) return;
    const c = centerOf(cells[i]);
    for (let k = 0; k < 10; k++) {
      const el = document.createElement('div'), a = (k / 10) * Math.PI * 2, d = c.w * (0.5 + Math.random() * 0.4);
      el.className = 'spark';
      el.style.background = k % 2 ? color : '#ffd23f';
      el.style.left = c.x - 4 + 'px'; el.style.top = c.y - 4 + 'px';
      el.style.setProperty('--dx', Math.cos(a) * d + 'px'); el.style.setProperty('--dy', Math.sin(a) * d + 'px');
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 650);
    }
  }
  function toast(msg) {
    const el = document.createElement('div');
    el.className = 'toast'; el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2300);
  }

  // ---------- merging ----------
  async function flySlice(from, to, ti) {
    const t = S.board[from].t, si = S.board[from].n - 1;
    S.board[from].n--;
    renderCell(from);
    const a = cells[from].getBoundingClientRect(), b = cells[to].getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'flyer';
    Object.assign(el.style, { left: a.left + 'px', top: a.top + 'px', width: a.width + 'px', height: a.height + 'px' });
    el.innerHTML = `<svg viewBox="-50 -50 100 100">${wedge(si, CAKES[t])}</svg>`;
    document.body.appendChild(el);
    void el.offsetWidth;
    el.style.transform = `translate(${b.left - a.left}px, ${b.top - a.top}px) rotate(${(ti - si) * 60}deg)`;
    await sleep(T_FLY);
    el.remove();
    S.board[to].n++;
    renderCell(to, 'bump');
  }

  async function resolve(cell) {
    const t = S.board[cell].t;
    const comp = flood(cell, t);
    if (comp.length < 2) return [];
    const sum = comp.reduce((a, i) => a + S.board[i].n, 0);
    // fullest plates receive first; ties go to the plate nearest the one just placed
    comp.sort((a, b) => S.board[b].n - S.board[a].n || dist(a, cell) - dist(b, cell));
    const full = Math.floor(sum / MAX), rem = sum % MAX;
    const want = new Map(comp.map((i, k) => [i, k < full ? MAX : k === full ? rem : 0]));
    const donors = comp.filter((i) => S.board[i].n > want.get(i)).map((i) => ({ i, extra: S.board[i].n - want.get(i) }));
    const moves = [];
    for (const r of comp) {
      let need = want.get(r) - S.board[r].n;
      while (need > 0) {
        donors.sort((x, y) => dist(x.i, r) - dist(y.i, r));
        const d = donors.find((d) => d.extra > 0);
        d.extra--; need--;
        moves.push([d.i, r]);
      }
    }
    const proj = new Map(comp.map((i) => [i, S.board[i].n]));
    await Promise.all(moves.map(([f, to], k) => sleep(k * T_GAP).then(() => {
      const ti = proj.get(to); proj.set(to, ti + 1);
      return flySlice(f, to, ti);
    })));
    await sleep(RM ? 0 : 100);

    const emptied = comp.filter((i) => S.board[i].n === 0);
    const filled = comp.filter((i) => S.board[i].n === MAX);
    emptied.forEach((i) => cells[i].classList.add('vanish'));
    filled.forEach((i) => { cells[i].classList.add('pop'); sparks(i, CAKES[t].top); });
    if (emptied.length || filled.length) await sleep(RM ? 0 : 480);
    emptied.concat(filled).forEach((i) => { S.board[i] = null; renderCell(i); });
    return filled;
  }

  async function place(idx, cell) {
    if (busy || S.over || S.board[cell] || !S.tray[idx]) return;
    busy = true; sel = -1;
    setHint(-1);
    S.board[cell] = S.tray[idx];
    S.tray[idx] = null;
    renderTray();
    renderBoard();
    renderCell(cell, 'drop');
    await sleep(RM ? 0 : 180);

    const typesBefore = typeCount();
    const filled = await resolve(cell);
    if (filled.length) {
      S.combo++;
      const gain = filled.length * 60 * S.combo + (filled.length > 1 ? 40 * filled.length : 0);
      S.score += gain;
      const before = S.clears;
      S.clears += filled.length;
      if (Math.floor(S.clears / 10) > Math.floor(before / 10)) { S.shuffles++; setTimeout(() => toast('접시 바꾸기 +1'), 900); }
      floatText(filled[0], `+${gain}${S.combo > 1 ? `<small>콤보 ×${S.combo}</small>` : ''}`);
      if (typeCount() > typesBefore) toast(`새 케이크 등장: ${CAKES[typeCount() - 1].name}`);
    } else {
      S.combo = 0;
    }
    if (S.tray.every((p) => !p)) { refillTray(); renderTray(true); }
    if (!S.board.some((p) => !p)) { S.over = true; save(); fillOver(); $('#over').hidden = false; }
    renderStats();
    renderBoard();
    save();
    busy = false;
  }

  function fillOver() {
    $('#overScore').textContent = S.score.toLocaleString();
    $('#overNote').textContent = `완성한 케이크 ${S.clears}판 · 최고 ${bestScore().toLocaleString()}점`;
  }

  // ---------- input ----------
  function onCellTap(i) {
    if (drag || busy) return;
    if (sel >= 0 && !S.board[i]) place(sel, i);
  }
  function select(i) {
    sel = (sel === i || !S.tray[i]) ? -1 : i;
    renderTray();
    cells.forEach((c, k) => c.classList.toggle('can', !S.board[k] && sel >= 0));
    setHint(-1);
  }
  function cellAt(x, y) {
    const el = document.elementFromPoint(x, y);
    const c = el && el.closest('.cell');
    return c ? +c.dataset.i : -1;
  }
  function bindSlot(el, i) {
    el.addEventListener('pointerdown', (e) => {
      if (busy || S.over || !S.tray[i] || e.button > 0) return;
      e.preventDefault();
      el.setPointerCapture(e.pointerId);
      drag = { i, x0: e.clientX, y0: e.clientY, moved: false, ghost: null, lift: e.pointerType === 'mouse' ? 0 : 48, target: -1 };
    });
    el.addEventListener('pointermove', (e) => {
      if (!drag || drag.i !== i) return;
      if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 8) {
        drag.moved = true;
        sel = -1; renderTray();
        el.classList.add('lifting');
        const g = document.createElement('div'), w = cells[0].getBoundingClientRect().width;
        g.className = 'ghost';
        g.style.width = g.style.height = w + 'px';
        g.innerHTML = plateSVG(S.tray[i]);
        document.body.appendChild(g);
        drag.ghost = g; drag.w = w;
      }
      if (drag.moved) {
        const x = e.clientX, y = e.clientY - drag.lift;
        drag.ghost.style.transform = `translate(${x - drag.w / 2}px, ${y - drag.w / 2}px) scale(1.08)`;
        const t = cellAt(x, y);
        if (t !== drag.target) { drag.target = t; setHint(t, S.tray[i]); }
      }
    });
    const end = (e, cancel) => {
      if (!drag || drag.i !== i) return;
      const d = drag;
      drag = null;
      if (d.ghost) d.ghost.remove();
      el.classList.remove('lifting');
      setHint(-1);
      if (!d.moved) { if (!cancel) select(i); return; }
      const t = cellAt(e.clientX, e.clientY - d.lift);
      if (!cancel && t >= 0 && !S.board[t]) place(i, t);
      else renderTray();
    };
    el.addEventListener('pointerup', (e) => end(e, false));
    el.addEventListener('pointercancel', (e) => end(e, true));
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(i); } });
  }

  let confirmTimer = 0;
  function newGame() {
    S = fresh(S && S.oneSlice);
    sel = -1;
    refillTray();
    $('#over').hidden = true;
    renderAll();
    renderTray(true);
    save();
  }
  $('#newBtn').addEventListener('click', () => {
    const b = $('#newBtn');
    if (S.over || !S.board.some(Boolean) || b.classList.contains('warn')) {
      clearTimeout(confirmTimer); b.classList.remove('warn'); b.textContent = '새 게임';
      if (!busy) newGame();
      return;
    }
    b.classList.add('warn'); b.textContent = '정말 새로 시작?';
    confirmTimer = setTimeout(() => { b.classList.remove('warn'); b.textContent = '새 게임'; }, 3000);
  });
  $('#againBtn').addEventListener('click', () => { if (!busy) newGame(); });
  $('#shuffleBtn').addEventListener('click', () => {
    if (busy || S.over || S.shuffles <= 0) return;
    const idx = [0, 1, 2].filter((i) => S.tray[i]);
    if (!idx.length) return;
    const fresh3 = genPlates(idx.length);
    idx.forEach((i, k) => { S.tray[i] = fresh3[k]; });
    S.shuffles--; sel = -1;
    renderTray(true); renderStats(); save();
  });
  $('#oneSlice').addEventListener('change', (e) => {
    S.oneSlice = e.target.checked;
    toast(S.oneSlice ? '이제 1조각 접시만 나와요' : '1~3조각 접시가 나와요');
    save();
  });

  // ---------- boot ----------
  function start(data) {
    let d = data && valid(data) ? data : null;
    if (!d) { try { const raw = store.get(SAVE_KEY); const p = raw && JSON.parse(raw); if (valid(p)) d = p; } catch (e) {} }
    S = d ? Object.assign(fresh(), d) : fresh();
    if (S.tray.every((p) => !p) && !S.over) refillTray();
    if (!cells.length) buildDom();
    renderAll();
    renderTray(true);
    save();
  }
  window.claude?.hot?.snapshot?.(() => S);
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
