<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>무한 2048</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: sea-glass tray — score bar, one square 4×4 board, undo below; the whole screen takes swipes */
:root {
  --bg: #e4eff1;
  --board: #b4cad1;
  --slot: #cbdde2;
  --ink: #23404a;
  --muted: #5f7f88;
  --card: #f7fbfc;
  --accent: #ff5d7a;
  --line: rgba(35, 64, 74, .14);
  --display: 'Jua', 'Gowun Dodum', system-ui, sans-serif;
  --body: 'Gowun Dodum', system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif;
  --g: 10px;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  box-sizing: border-box;
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.app { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.top { display: flex; align-items: center; gap: 8px; }
.top h1 { flex: 1; text-align: center; font-family: var(--display); font-weight: 400; font-size: 30px; margin: 0; letter-spacing: -.5px; }
.top h1 span { color: var(--accent); }
.btn {
  font-family: var(--display); font-size: 15px; color: var(--ink); text-decoration: none;
  background: var(--card); border: 2px solid var(--line); border-radius: 999px;
  padding: 6px 14px; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn.warn, .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--card); }
.btn:disabled { opacity: .45; cursor: default; }

.stats { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; }
.stat { background: var(--card); border-radius: 14px; padding: 6px 12px; display: flex; flex-direction: column; min-width: 0; }
.stat .lab { font-size: 11px; letter-spacing: .08em; color: var(--muted); }
.stat b { font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1.15; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat:first-child b { color: var(--accent); }

.board {
  position: relative; width: min(100%, calc(100dvh - 260px)); min-width: 240px; aspect-ratio: 1; max-width: 100%;
  margin: 0 auto; box-sizing: border-box; padding: var(--g); border-radius: 18px; background: var(--board);
  box-shadow: 0 6px 0 rgba(35, 64, 74, .12);
}
.grid, .tiles { position: absolute; inset: var(--g); }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: var(--g); }
.grid div { border-radius: 10px; background: var(--slot); }
.tile {
  position: absolute; left: 0; top: 0;
  width: calc((100% - 3 * var(--g)) / 4); height: calc((100% - 3 * var(--g)) / 4);
  transform: translate(calc(var(--c) * (100% + var(--g))), calc(var(--r) * (100% + var(--g))));
  transition: transform .11s ease-in-out;
}
.tile .face {
  width: 100%; height: 100%; border-radius: 10px; display: grid; place-items: center;
  font-family: var(--display); font-variant-numeric: tabular-nums; line-height: 1;
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .12);
}
.tile.new .face { animation: appear .18s ease-out .06s backwards; }
.tile.merged .face { animation: merge .2s ease-out; }
@keyframes appear { from { transform: scale(0); } }
@keyframes merge { 50% { transform: scale(1.16); } }

.tools { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.note { font-size: 13px; color: var(--muted); }
.help { margin: 0; font-size: 12.5px; line-height: 1.55; color: var(--muted); }

.over { position: absolute; inset: 0; border-radius: 18px; background: rgba(228, 239, 241, .82); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 16px; }
.over h2 { font-family: var(--display); font-weight: 400; font-size: 28px; margin: 0; }
.over p { margin: 0; color: var(--muted); }
.over .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

.toast {
  position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--card); padding: 8px 16px; border-radius: 999px;
  font-family: var(--display); font-size: 15px; z-index: 30; white-space: nowrap; animation: toast 2.2s ease forwards;
}
@keyframes toast { 0% { opacity: 0; } 10%, 85% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } .tile .face { animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="btn" href="../../index.html" aria-label="홈으로">‹ 홈</a>
    <h1>무한 <span>2048</span></h1>
    <button class="btn" id="newBtn" type="button">새 게임</button>
  </header>

  <div class="stats">
    <div class="stat"><span class="lab">점수</span><b id="score">0</b></div>
    <div class="stat"><span class="lab">최고</span><b id="best">0</b></div>
    <div class="stat"><span class="lab">가장 큰 수</span><b id="top">2</b></div>
  </div>

  <div class="board" id="board" aria-label="2048 판">
    <div class="grid" aria-hidden="true"></div>
    <div class="tiles" id="tiles"></div>
    <div class="over" id="over" hidden>
      <h2>더 움직일 수 없어요</h2>
      <p id="overText"></p>
      <div class="row">
        <button class="btn primary" id="overUndo" type="button">되돌리기</button>
        <button class="btn" id="overNew" type="button">새 게임</button>
      </div>
    </div>
  </div>

  <div class="tools">
    <button class="btn" id="undoBtn" type="button">되돌리기 · <span id="undoN">3</span></button>
    <span class="note" id="note"></span>
  </div>
  <p class="help">화면 어디서든 위·아래·왼쪽·오른쪽으로 밀거나 방향키(WASD)를 누르세요. 같은 숫자가 부딪히면 합쳐져요. 2048에서 멈추지 않고 4096, 8192… 끝없이 이어져요. 512 이상을 새로 만들 때마다 되돌리기가 1번 늘어요. 진행 상황은 자동 저장돼요.</p>
</div>

<script>
(() => {
  const SIZE = 4, SAVE_KEY = '2048-v1', BEST_KEY = '2048-best', MOVE_MS = 110;
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // sea glass → sunshine → coral → violet → deep night, then hues keep cycling for anything bigger
  const PALETTE = {
    2: ['#f7fbfc', '#23404a'], 4: ['#e1f3f0', '#23404a'], 8: ['#a5e2d3', '#1d4a45'], 16: ['#62cfb9', '#ffffff'],
    32: ['#35b4a7', '#ffffff'], 64: ['#1e97a3', '#ffffff'], 128: ['#ffd96e', '#5a3d00'], 256: ['#ffc145', '#5a3d00'],
    512: ['#ffa33a', '#ffffff'], 1024: ['#ff7e5f', '#ffffff'], 2048: ['#ff5d7a', '#ffffff'], 4096: ['#c86bfa', '#ffffff'],
    8192: ['#8a5cf6', '#ffffff'], 16384: ['#5b6cf9', '#ffffff'], 32768: ['#2f3d8f', '#ffffff'],
  };
  const colorOf = (v) => PALETTE[v] || [`hsl(${(Math.log2(v) * 47) % 360} 60% 38%)`, '#ffffff'];

  const $ = (s) => document.querySelector(s);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };

  let S = null;            // { grid: number[4][4], score, undos, prev, over }
  let tiles = [];          // live tile objects { id, v, r, c, el }
  let nextId = 1, pending = null;

  const emptyGrid = () => Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
  const maxTile = (g) => Math.max(...g.flat());
  function fresh() {
    const s = { grid: emptyGrid(), score: 0, undos: 3, prev: null, over: false };
    S = s; addRandom(); addRandom();
    return s;
  }
  function valid(d) {
    return d && Array.isArray(d.grid) && d.grid.length === SIZE && d.grid.every((r) => Array.isArray(r) && r.length === SIZE && r.every((v) => v === 0 || (v >= 2 && (v & (v - 1)) === 0)));
  }
  const save = () => {
    store.set(SAVE_KEY, JSON.stringify(S));
    if (S.score > (+store.get(BEST_KEY) || 0)) store.set(BEST_KEY, String(S.score));
  };

  function addRandom() {
    const free = [];
    S.grid.forEach((row, r) => row.forEach((v, c) => { if (!v) free.push([r, c]); }));
    if (!free.length) return null;
    const [r, c] = free[Math.floor(Math.random() * free.length)];
    S.grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    return [r, c];
  }
  function canMove() {
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      const v = S.grid[r][c];
      if (!v) return true;
      if (c < SIZE - 1 && S.grid[r][c + 1] === v) return true;
      if (r < SIZE - 1 && S.grid[r + 1][c] === v) return true;
    }
    return false;
  }

  // ---------- tiles ----------
  function makeTile(v, r, c, cls) {
    const el = document.createElement('div');
    el.className = 'tile' + (cls ? ' ' + cls : '');
    el.innerHTML = '<div class="face"></div>';
    const t = { id: nextId++, v, r, c, el };
    paint(t);
    $('#tiles').appendChild(el);
    tiles.push(t);
    return t;
  }
  function paint(t) {
    t.el.style.setProperty('--r', t.r);
    t.el.style.setProperty('--c', t.c);
    const [bg, fg] = colorOf(t.v), face = t.el.firstChild, digits = String(t.v).length;
    face.style.background = bg; face.style.color = fg;
    face.style.fontSize = `calc(var(--tile) * ${[0, .5, .5, .44, .36, .3, .25, .21][Math.min(digits, 7)]})`;
    face.textContent = t.v;
  }
  function rebuild() {
    $('#tiles').textContent = '';
    tiles = [];
    S.grid.forEach((row, r) => row.forEach((v, c) => { if (v) makeTile(v, r, c); }));
  }
  function sizeTiles() {
    const w = $('#tiles').clientWidth;
    $('#board').style.setProperty('--tile', ((w - 30) / 4) + 'px');
  }

  // ---------- moving ----------
  const DIRS = { left: [0, -1], right: [0, 1], up: [-1, 0], down: [1, 0] };
  function move(dir) {
    if (S.over) return;
    if (pending) finish();
    const [dr, dc] = DIRS[dir];
    const at = emptyGrid().map((row) => row.map(() => null));
    tiles.forEach((t) => { at[t.r][t.c] = t; });
    const rows = [...Array(SIZE).keys()], cols = [...Array(SIZE).keys()];
    if (dr === 1) rows.reverse();
    if (dc === 1) cols.reverse();
    const merged = new Set(), dead = [];
    let moved = false, gained = 0, bonus = 0;
    const before = { grid: S.grid.map((r) => r.slice()), score: S.score };

    for (const r of rows) for (const c of cols) {
      const t = at[r][c];
      if (!t) continue;
      let nr = r, nc = c;
      while (true) {
        const tr = nr + dr, tc = nc + dc;
        if (tr < 0 || tr >= SIZE || tc < 0 || tc >= SIZE) break;
        const o = at[tr][tc];
        if (!o) { nr = tr; nc = tc; continue; }
        if (o.v === t.v && !merged.has(o.id)) {
          at[r][c] = null;
          t.r = tr; t.c = tc;
          dead.push(t);
          o.v *= 2;
          merged.add(o.id);
          gained += o.v;
          if (o.v >= 512 && o.v > maxTile(before.grid)) bonus++;
          moved = true;
          nr = null;
        }
        break;
      }
      if (nr === null) continue;
      if (nr !== r || nc !== c) { at[r][c] = null; at[nr][nc] = t; t.r = nr; t.c = nc; moved = true; }
    }
    if (!moved) return;

    S.prev = before;
    S.score += gained;
    S.grid = emptyGrid();
    tiles.forEach((t) => { if (!dead.includes(t)) S.grid[t.r][t.c] = t.v; });
    const spot = addRandom();
    if (bonus) { S.undos += 1; toast(`${maxTile(S.grid)} 달성! 되돌리기 +1`); }

    // slide everything first, then settle merges and drop in the new tile
    tiles.forEach((t) => { t.el.style.setProperty('--r', t.r); t.el.style.setProperty('--c', t.c); t.el.classList.remove('new', 'merged'); });
    pending = { dead, merged, spot };
    pending.timer = setTimeout(finish, RM ? 0 : MOVE_MS);
    if (!canMove()) S.over = true;
    save();
    renderStats();
  }
  function finish() {
    if (!pending) return;
    const { dead, merged, spot, timer } = pending;
    clearTimeout(timer);
    pending = null;
    dead.forEach((t) => t.el.remove());
    tiles = tiles.filter((t) => !dead.includes(t));
    tiles.forEach((t) => {
      if (merged.has(t.id)) { paint(t); void t.el.offsetWidth; t.el.classList.add('merged'); }
    });
    if (spot) makeTile(S.grid[spot[0]][spot[1]], spot[0], spot[1], 'new');
    if (S.over) showOver();
  }

  function undo() {
    if (!S.prev || S.undos <= 0) return;
    if (pending) finish();
    S.grid = S.prev.grid; S.score = S.prev.score; S.prev = null; S.undos--; S.over = false;
    $('#over').hidden = true;
    rebuild(); renderStats(); save();
  }

  // ---------- UI ----------
  function renderStats() {
    $('#score').textContent = S.score.toLocaleString();
    $('#best').textContent = Math.max(+store.get(BEST_KEY) || 0, S.score).toLocaleString();
    const top = maxTile(S.grid);
    $('#top').textContent = top.toLocaleString();
    $('#undoN').textContent = S.undos;
    $('#undoBtn').disabled = !S.prev || S.undos <= 0;
    const goal = Math.max(2048, top * 2);
    $('#note').textContent = `다음 목표 ${goal.toLocaleString()}`;
  }
  function showOver() {
    $('#overText').textContent = `점수 ${S.score.toLocaleString()} · 가장 큰 수 ${maxTile(S.grid).toLocaleString()}`;
    $('#overUndo').hidden = !S.prev || S.undos <= 0;
    $('#over').hidden = false;
  }
  function toast(msg) {
    const el = document.createElement('div');
    el.className = 'toast'; el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2300);
  }
  function newGame() {
    if (pending) finish();
    fresh();
    $('#over').hidden = true;
    rebuild(); renderStats(); save();
    tiles.forEach((t) => t.el.classList.add('new'));
  }

  let confirmTimer = 0;
  $('#newBtn').addEventListener('click', () => {
    const b = $('#newBtn');
    if (S.over || S.score === 0 || b.classList.contains('warn')) {
      clearTimeout(confirmTimer); b.classList.remove('warn'); b.textContent = '새 게임';
      return newGame();
    }
    b.classList.add('warn'); b.textContent = '정말 새로 시작?';
    confirmTimer = setTimeout(() => { b.classList.remove('warn'); b.textContent = '새 게임'; }, 3000);
  });
  $('#undoBtn').addEventListener('click', undo);
  $('#overUndo').addEventListener('click', undo);
  $('#overNew').addEventListener('click', newGame);

  const KEYS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down', A: 'left', D: 'right', W: 'up', S: 'down' };
  addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if ((e.key === 'z' || e.key === 'Z' || e.key === 'u' || e.key === 'U')) { undo(); return; }
    const d = KEYS[e.key];
    if (!d) return;
    e.preventDefault();
    move(d);
  });

  // swipes anywhere on the screen
  let sw = null;
  document.body.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button, a') || e.button > 0) return;
    sw = { x: e.clientX, y: e.clientY, done: false };
    try { document.body.setPointerCapture(e.pointerId); } catch (err) {}
  });
  document.body.addEventListener('pointermove', (e) => {
    if (!sw || sw.done) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 28) return;
    sw.done = true;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });
  const endSwipe = () => { sw = null; };
  document.body.addEventListener('pointerup', endSwipe);
  document.body.addEventListener('pointercancel', endSwipe);

  addEventListener('resize', sizeTiles);

  // ---------- boot ----------
  try { const d = JSON.parse(store.get(SAVE_KEY)); if (valid(d)) S = Object.assign({ score: 0, undos: 3, prev: null, over: false }, d); } catch (e) {}
  if (!S) fresh();
  document.querySelector('.grid').innerHTML = '<div></div>'.repeat(SIZE * SIZE);
  sizeTiles();
  rebuild();
  renderStats();
  if (S.over) showOver();
})();
</script>
</body>
</html>
