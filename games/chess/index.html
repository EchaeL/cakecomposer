<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>체스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Noto+Sans+Symbols+2&display=swap">
<style>
/* Layout: one column — mode menu, or a game view with opponent bar, slate board, my bar, move strip and actions */
:root {
  --bg: #eceef2;
  --card: #ffffff;
  --ink: #1f2430;
  --muted: #667085;
  --accent: #3d6bd8;
  --line: rgba(31, 36, 48, .12);
  --sq-light: #dfe3ea;
  --sq-dark: #8695ac;
  --hl-last: rgba(246, 205, 76, .55);
  --hl-sel: rgba(61, 107, 216, .45);
  --hl-check: rgba(226, 68, 68, .75);
  --dot: rgba(31, 36, 48, .28);
  --good: #2f9e6a;
  --bad: #d64545;
  --white-piece: #fbfaf7;
  --black-piece: #1f2430;
  --display: 'Jua', 'Gowun Dodum', system-ui, sans-serif;
  --body: 'Gowun Dodum', system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif;
  --glyph: 'Noto Sans Symbols 2', 'Segoe UI Symbol', 'Apple Symbols', 'DejaVu Sans', serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171d; --card: #1e232c; --ink: #e8ebf2; --muted: #9aa3b5; --accent: #7da2ff; --line: rgba(232, 235, 242, .12);
    --sq-light: #c3cad6; --sq-dark: #66768e; --dot: rgba(20, 23, 29, .38); --good: #4cc48c; --bad: #ff6b6b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171d; --card: #1e232c; --ink: #e8ebf2; --muted: #9aa3b5; --accent: #7da2ff; --line: rgba(232, 235, 242, .12);
  --sq-light: #c3cad6; --sq-dark: #66768e; --dot: rgba(20, 23, 29, .38); --good: #4cc48c; --bad: #ff6b6b;
  color-scheme: dark;
}
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 24px;
  -webkit-tap-highlight-color: transparent;
}
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.top { display: flex; align-items: center; gap: 8px; }
.top h1 { flex: 1; text-align: center; font-family: var(--display); font-weight: 400; font-size: 28px; margin: 0; }
.btn {
  font-family: var(--display); font-size: 15px; color: var(--ink); text-decoration: none;
  background: var(--card); border: 2px solid var(--line); border-radius: 999px;
  padding: 7px 15px; cursor: pointer; white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:focus-visible, .seg button:focus-visible, .sq:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--card); }
.btn.warn { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }

/* menu */
.menu { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--card); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 0 var(--line); }
.card h2 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0; display: flex; align-items: center; gap: 10px; }
.card h2 .glyph { font-family: var(--glyph); font-size: 26px; line-height: 1; }
.card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 12px; letter-spacing: .06em; color: var(--muted); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--bg); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { font-family: var(--display); font-size: 15px; border: 0; background: none; color: var(--ink); padding: 8px 6px; border-radius: 9px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--accent); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.live { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.live .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 var(--good); animation: pulse 1.6s infinite; }
.notice { font-size: 13px; color: var(--muted); background: var(--bg); border-radius: 12px; padding: 10px 12px; line-height: 1.5; }
.searching { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

/* game */
.game { display: flex; flex-direction: column; gap: 8px; }
.player { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.player .avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-family: var(--glyph); font-size: 20px; background: var(--card); flex: none; overflow: hidden; }
.player .avatar img { width: 100%; height: 100%; object-fit: cover; }
.player .who { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.player .name { font-family: var(--display); font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player .taken { font-family: var(--glyph); font-size: 15px; color: var(--muted); letter-spacing: -1px; min-height: 18px; white-space: nowrap; overflow: hidden; }
.player .taken b { font-family: var(--body); font-weight: 400; font-size: 12px; letter-spacing: 0; margin-left: 4px; }
.player .turn { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--card); color: var(--muted); white-space: nowrap; }
.player .turn.on { background: var(--accent); color: var(--card); }
.player .turn.off { background: var(--bad); color: #fff; }

.boardwrap { position: relative; width: min(100%, calc(100dvh - 300px)); min-width: 260px; max-width: 100%; margin: 0 auto; }
.board { display: grid; grid-template-columns: repeat(8, 1fr); aspect-ratio: 1; border-radius: 10px; overflow: hidden; box-shadow: 0 8px 24px rgba(0, 0, 0, .16); touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.sq { position: relative; border: 0; padding: 0; margin: 0; background: var(--sq-light); display: grid; place-items: center; cursor: pointer; container-type: size; }
.sq.dark { background: var(--sq-dark); }
.sq.last::before, .sq.sel::before, .sq.check::before { content: ''; position: absolute; inset: 0; }
.sq.last::before { background: var(--hl-last); }
.sq.sel::before { background: var(--hl-sel); }
.sq.check::before { background: radial-gradient(circle, var(--hl-check) 0, transparent 70%); }
.sq.target::after { content: ''; position: absolute; width: 30%; height: 30%; border-radius: 50%; background: var(--dot); }
.sq.target.capture::after { width: 86%; height: 86%; background: none; border: 5px solid var(--dot); box-sizing: border-box; }
.sq .coord { position: absolute; font-size: 10px; font-family: var(--body); line-height: 1; opacity: .75; pointer-events: none; color: var(--black-piece); }
.sq.dark .coord { color: var(--white-piece); }
.sq .coord.f { right: 3px; bottom: 2px; }
.sq .coord.r { left: 3px; top: 2px; }
.pc { position: relative; font-family: var(--glyph); font-size: calc(var(--sqpx, 44px) * .82); font-size: 82cqw; line-height: 1; pointer-events: none; z-index: 1; }
.pc.w { color: var(--white-piece); -webkit-text-stroke: 1.4px #1f2430; paint-order: stroke fill; text-shadow: 0 2px 2px rgba(0, 0, 0, .18); }
.pc.b { color: var(--black-piece); -webkit-text-stroke: .6px rgba(255, 255, 255, .35); text-shadow: 0 2px 2px rgba(0, 0, 0, .25); }

.result { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; background: rgba(20, 23, 29, .35); border-radius: 10px; padding: 16px; }
.result .box { background: var(--card); border-radius: 18px; padding: 20px; text-align: center; display: flex; flex-direction: column; gap: 10px; width: min(300px, 100%); box-sizing: border-box; }
.result h3 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0; }
.result p { margin: 0; color: var(--muted); font-size: 14px; }
.promo { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; background: rgba(20, 23, 29, .35); border-radius: 10px; }
.promo .box { background: var(--card); border-radius: 16px; padding: 10px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.promo button { width: 64px; height: 64px; border-radius: 12px; border: 2px solid var(--line); background: var(--sq-light); cursor: pointer; container-type: size; display: grid; place-items: center; }
.promo button:hover { border-color: var(--accent); }

.status { text-align: center; font-family: var(--display); font-size: 17px; min-height: 24px; }
.status.alert { color: var(--bad); }
.moves { display: flex; gap: 4px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: thin; font-variant-numeric: tabular-nums; }
.moves span { flex: none; font-size: 13px; padding: 3px 8px; border-radius: 8px; background: var(--card); }
.moves span.n { background: none; color: var(--muted); padding: 3px 2px 3px 6px; }
.moves:empty::before { content: '아직 둔 수가 없어요'; font-size: 13px; color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.offer { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; background: var(--card); border-radius: 14px; padding: 8px 12px; font-size: 14px; }
.toast {
  position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; max-width: calc(100% - 32px);
  font-family: var(--display); font-size: 15px; z-index: 30; animation: toast 2.6s ease forwards;
}
@keyframes toast { 0% { opacity: 0; } 8%, 85% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .spinner, .live .pulse { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="btn" id="homeBtn" href="../../index.html" aria-label="홈으로">‹ 홈</a>
    <h1>체스</h1>
    <button class="btn" id="menuBtn" type="button" hidden>메뉴</button>
  </header>

  <section class="menu" id="menu">
    <div class="card">
      <h2><span class="glyph" aria-hidden="true">♞&#xFE0E;</span>컴퓨터와 대전</h2>
      <div class="field"><span>난이도</span>
        <div class="seg" id="levelSeg" role="group" aria-label="난이도">
          <button type="button" data-v="easy">쉬움</button>
          <button type="button" data-v="normal" aria-pressed="true">보통</button>
          <button type="button" data-v="hard">어려움</button>
        </div>
      </div>
      <div class="field"><span>내 기물</span>
        <div class="seg" id="colorSeg" role="group" aria-label="내 기물 색">
          <button type="button" data-v="w" aria-pressed="true">백 (먼저)</button>
          <button type="button" data-v="b">흑</button>
          <button type="button" data-v="r">무작위</button>
        </div>
      </div>
      <div class="row">
        <button class="btn primary" id="aiStart" type="button">새 대국 시작</button>
        <button class="btn" id="aiResume" type="button" hidden>이어 하기</button>
      </div>
    </div>

    <div class="card">
      <h2><span class="glyph" aria-hidden="true">♚&#xFE0E;</span>온라인 대전</h2>
      <p>다른 기기에서 이 페이지를 열고 "상대 찾기"를 누른 사람과 바로 짝지어 줘요. 백과 흑은 무작위로 정해져요.</p>
      <div class="live" id="liveLine" hidden><span class="pulse" aria-hidden="true"></span><span id="liveText"></span></div>
      <div class="notice" id="onlineNotice">온라인 연결을 확인하는 중이에요…</div>
      <div class="row" id="onlineIdle" hidden>
        <button class="btn primary" id="findBtn" type="button">상대 찾기</button>
        <button class="btn" id="rejoinBtn" type="button" hidden>진행 중인 대국으로</button>
      </div>
      <div class="row" id="onlineSearching" hidden>
        <div class="searching"><span class="spinner" aria-hidden="true"></span><span id="searchText">상대를 찾는 중…</span></div>
        <button class="btn" id="cancelBtn" type="button">취소</button>
      </div>
    </div>
  </section>

  <section class="game" id="game" hidden>
    <div class="player" id="topBar"></div>
    <div class="boardwrap" id="boardwrap">
      <div class="board" id="board" role="grid" aria-label="체스판"></div>
      <div class="promo" id="promo" hidden><div class="box" id="promoBox"></div></div>
      <div class="result" id="result" hidden>
        <div class="box">
          <h3 id="resTitle"></h3>
          <p id="resText"></p>
          <div class="row" style="justify-content:center">
            <button class="btn primary" id="resAgain" type="button">다시 하기</button>
            <button class="btn" id="resView" type="button">판 보기</button>
          </div>
        </div>
      </div>
    </div>
    <div class="player" id="bottomBar"></div>
    <div class="status" id="status" role="status"></div>
    <div class="offer" id="offer" hidden></div>
    <div class="moves" id="moves" aria-label="기보"></div>
    <div class="actions" id="actions"></div>
  </section>
</div>

<script>
(() => {
  // ---------- rules + search engine (0x88 board) ----------
  // Written as one function so the same code runs on the page and inside the AI worker.
  function ChessEngine() {
    const P = 1, N = 2, B = 3, R = 4, Q = 5, K = 6;
    const KNIGHT = [33, 31, 18, 14, -33, -31, -18, -14];
    const BISHOP = [15, 17, -15, -17];
    const ROOK = [16, -16, 1, -1];
    const KING = [15, 16, 17, 1, -1, -15, -16, -17];
    const LETTER = ['', 'p', 'n', 'b', 'r', 'q', 'k'];
    const CMASK = new Uint8Array(128).fill(15);
    CMASK[0] = 13; CMASK[7] = 14; CMASK[4] = 12; CMASK[112] = 7; CMASK[119] = 11; CMASK[116] = 3;

    const board = new Int8Array(128);
    const kings = [4, 116];          // [white, black]
    let side = 1, castle = 15, ep = -1, half = 0, full = 1;
    const hist = [], keys = [];

    const onBoard = (s) => !(s & 0x88);
    const rankOf = (s) => s >> 4, fileOf = (s) => s & 7;
    const sqName = (s) => 'abcdefgh'[fileOf(s)] + (rankOf(s) + 1);
    const sqFrom = (n) => (n.charCodeAt(1) - 49) * 16 + (n.charCodeAt(0) - 97);
    const kIdx = (s) => (s === 1 ? 0 : 1);

    function load(fen) {
      board.fill(0);
      const [pos, stm, cas, eps, hm, fm] = fen.trim().split(/\s+/);
      let r = 7, f = 0;
      for (const ch of pos) {
        if (ch === '/') { r--; f = 0; continue; }
        if (ch >= '1' && ch <= '8') { f += +ch; continue; }
        const t = LETTER.indexOf(ch.toLowerCase());
        const v = ch === ch.toUpperCase() ? t : -t;
        board[r * 16 + f] = v;
        if (t === K) kings[kIdx(v > 0 ? 1 : -1)] = r * 16 + f;
        f++;
      }
      side = stm === 'b' ? -1 : 1;
      castle = 0;
      if (cas && cas !== '-') {
        if (cas.includes('K')) castle |= 1; if (cas.includes('Q')) castle |= 2;
        if (cas.includes('k')) castle |= 4; if (cas.includes('q')) castle |= 8;
      }
      ep = eps && eps !== '-' ? sqFrom(eps) : -1;
      half = +hm || 0; full = +fm || 1;
      hist.length = 0; keys.length = 0; keys.push(key());
    }
    function fen() {
      let out = '';
      for (let r = 7; r >= 0; r--) {
        let empty = 0;
        for (let f = 0; f < 8; f++) {
          const v = board[r * 16 + f];
          if (!v) { empty++; continue; }
          if (empty) { out += empty; empty = 0; }
          const l = LETTER[Math.abs(v)];
          out += v > 0 ? l.toUpperCase() : l;
        }
        if (empty) out += empty;
        if (r) out += '/';
      }
      let c = (castle & 1 ? 'K' : '') + (castle & 2 ? 'Q' : '') + (castle & 4 ? 'k' : '') + (castle & 8 ? 'q' : '');
      return `${out} ${side === 1 ? 'w' : 'b'} ${c || '-'} ${ep >= 0 ? sqName(ep) : '-'} ${half} ${full}`;
    }
    function key() {
      let k = '';
      for (let s = 0; s < 128; s++) if (onBoard(s)) k += String.fromCharCode(70 + board[s]);
      return k + side + castle + ep;
    }

    function attacked(sq, by) {
      // pawns
      if (by === 1) {
        if (onBoard(sq - 15) && board[sq - 15] === P) return true;
        if (onBoard(sq - 17) && board[sq - 17] === P) return true;
      } else {
        if (onBoard(sq + 15) && board[sq + 15] === -P) return true;
        if (onBoard(sq + 17) && board[sq + 17] === -P) return true;
      }
      for (const d of KNIGHT) { const t = sq + d; if (onBoard(t) && board[t] === by * N) return true; }
      for (const d of KING) { const t = sq + d; if (onBoard(t) && board[t] === by * K) return true; }
      for (const d of BISHOP) {
        for (let t = sq + d; onBoard(t); t += d) {
          const v = board[t];
          if (v) { if (v === by * B || v === by * Q) return true; break; }
        }
      }
      for (const d of ROOK) {
        for (let t = sq + d; onBoard(t); t += d) {
          const v = board[t];
          if (v) { if (v === by * R || v === by * Q) return true; break; }
        }
      }
      return false;
    }
    const inCheck = (s = side) => attacked(kings[kIdx(s)], -s);

    // flag: 0 normal, 1 double push, 2 en passant, 3 castle king side, 4 castle queen side
    function gen(capturesOnly) {
      const out = [], s = side;
      const add = (from, to, p, cap, promo, flag) => out.push({ from, to, p, cap, promo, flag });
      for (let sq = 0; sq < 128; sq++) {
        if (sq & 0x88) { sq += 7; continue; }
        const p = board[sq];
        if (p * s <= 0) continue;
        const t = Math.abs(p);
        if (t === P) {
          const dir = 16 * s, last = s === 1 ? 7 : 0, start = s === 1 ? 1 : 6;
          const one = sq + dir;
          if (onBoard(one) && !board[one]) {
            if (rankOf(one) === last) { for (const pr of [Q, R, B, N]) add(sq, one, p, 0, pr, 0); }
            else if (!capturesOnly) {
              add(sq, one, p, 0, 0, 0);
              if (rankOf(sq) === start && !board[one + dir]) add(sq, one + dir, p, 0, 0, 1);
            }
          }
          for (const d of [dir - 1, dir + 1]) {
            const to = sq + d;
            if (!onBoard(to)) continue;
            if (board[to] * s < 0) {
              if (rankOf(to) === last) { for (const pr of [Q, R, B, N]) add(sq, to, p, board[to], pr, 0); }
              else add(sq, to, p, board[to], 0, 0);
            } else if (to === ep) add(sq, to, p, -s * P, 0, 2);
          }
        } else if (t === N || t === K) {
          for (const d of t === N ? KNIGHT : KING) {
            const to = sq + d;
            if (!onBoard(to)) continue;
            const v = board[to];
            if (v * s > 0) continue;
            if (v || !capturesOnly) add(sq, to, p, v, 0, 0);
          }
          if (t === K && !capturesOnly) {
            const base = s === 1 ? 0 : 112, kc = s === 1 ? 1 : 4, qc = s === 1 ? 2 : 8;
            if (sq === base + 4 && !attacked(sq, -s)) {
              if ((castle & kc) && board[base + 7] === s * R && !board[base + 5] && !board[base + 6] &&
                !attacked(base + 5, -s) && !attacked(base + 6, -s)) add(sq, base + 6, p, 0, 0, 3);
              if ((castle & qc) && board[base] === s * R && !board[base + 3] && !board[base + 2] && !board[base + 1] &&
                !attacked(base + 3, -s) && !attacked(base + 2, -s)) add(sq, base + 2, p, 0, 0, 4);
            }
          }
        } else {
          const dirs = t === B ? BISHOP : t === R ? ROOK : KING;
          for (const d of dirs) {
            for (let to = sq + d; onBoard(to); to += d) {
              const v = board[to];
              if (v * s > 0) break;
              if (v || !capturesOnly) add(sq, to, p, v, 0, 0);
              if (v) break;
            }
          }
        }
      }
      return out;
    }

    function make(m) {
      hist.push({ m, castle, ep, half, full });
      const s = side;
      board[m.to] = m.promo ? m.promo * s : m.p;
      board[m.from] = 0;
      if (m.flag === 2) board[m.to - 16 * s] = 0;
      else if (m.flag === 3) { board[m.to - 1] = board[m.to + 1]; board[m.to + 1] = 0; }
      else if (m.flag === 4) { board[m.to + 1] = board[m.to - 2]; board[m.to - 2] = 0; }
      if (Math.abs(m.p) === K) kings[kIdx(s)] = m.to;
      castle &= CMASK[m.from] & CMASK[m.to];
      ep = m.flag === 1 ? m.from + 16 * s : -1;

    return { title: iWon ? '이겼어요!' : '졌어요', text: `${colorName(winner)} 승리 · ${REASON[o.reason] || ''}` };
  }

  function renderActions() {
    const a = $('#actions');
    a.innerHTML = '';
    const btn = (label, fn, cls = '') => { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn ' + cls; b.textContent = label; b.addEventListener('click', fn); a.appendChild(b); return b; };
    if (G.mode === 'ai') {
      const u = btn('무르기', undo);
      u.disabled = !G.san.length || (G.thinking && G.san.length < 2);
      if (!G.over) confirmBtn(btn('기권', null), '정말 기권할까요?', () => finish({ result: G.myColor === 1 ? '0-1' : '1-0', reason: 'resign' }));
      btn('새 대국', () => startAI(G.level, G.colorChoice), 'primary');
    } else {
      if (!G.over && G.status === 'playing') {
        const d = btn('무승부 제안', offerDraw);
        d.disabled = G.drawOffer === G.myColor;
        confirmBtn(btn('기권', null), '정말 기권할까요?', resignOnline);
        if (G.opponentGoneSince && Date.now() - G.opponentGoneSince > 60000) btn('승리로 끝내기', claimAbandon, 'primary');
      }
      if (G.over || G.status === 'waiting') btn('나가기', leaveOnline, G.over ? 'primary' : '');
    }
  }
  // two-step confirm inside the page (no browser dialogs)
  function confirmBtn(b, ask, fn) {
    const label = b.textContent;
    let armed = false, t = 0;
    b.addEventListener('click', () => {
      if (armed) { clearTimeout(t); fn(); return; }
      armed = true; b.textContent = ask; b.classList.add('warn');
      t = setTimeout(() => { armed = false; b.textContent = label; b.classList.remove('warn'); }, 3000);
    });
  }

  // ---------- moving ----------
  const myTurn = () => G && !G.over && !G.thinking && E.side === G.myColor && (G.mode === 'ai' || G.status === 'playing');
  function onSquare(sq) {
    if (!myTurn() || pendingPromo) return;
    const pick = targets.filter((m) => m.to === sq);
    if (selected >= 0 && pick.length) {
      if (pick.length > 1) return askPromotion(pick);
      return userMove(pick[0]);
    }
    const v = E.pieceAt(sq);
    if (v && Math.sign(v) === G.myColor && sq !== selected) {
      selected = sq;
      targets = E.legal().filter((m) => m.from === sq);
    } else { selected = -1; targets = []; }
    renderBoard();
  }
  function askPromotion(moves) {
    pendingPromo = moves;
    const box = $('#promoBox');
    box.innerHTML = '';
    for (const t of [5, 4, 3, 2]) {
      const b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = `<span class="pc ${G.myColor === 1 ? 'w' : 'b'}">${GLYPH[t]}${VS}</span>`;
      b.setAttribute('aria-label', ['', '', '나이트', '비숍', '룩', '퀸'][t]);
      b.addEventListener('click', () => { const m = moves.find((x) => x.promo === t); pendingPromo = null; $('#promo').hidden = true; userMove(m); });
      box.appendChild(b);
    }
    $('#promo').hidden = false;
  }
  $('#promo').addEventListener('click', (e) => { if (e.target.id === 'promo') { pendingPromo = null; $('#promo').hidden = true; } });

  function applyMove(m) {
    const s = E.san(m);
    G.san.push(s); G.uci.push(E.uci(m));
    E.play(m);
    G.lastMove = { from: m.from, to: m.to };
    selected = -1; targets = [];
    const st = E.status();
    if (st.over) G.over = { result: st.result, reason: st.reason };
    render();
    animateMove(m.from, m.to);
  }
  function userMove(m) {
    applyMove(m);
    if (G.mode === 'ai') { saveAI(); if (!G.over) aiTurn(); }
    else pushOnline();
  }
  function finish(over) {
    G.over = over;
    aiToken++; G.thinking = false;
    if (G.mode === 'ai') saveAI();
    render();
  }

  // ---------- vs computer ----------
  function startAI(level, colorChoice) {
    const myColor = colorChoice === 'r' ? (Math.random() < 0.5 ? 1 : -1) : colorChoice === 'b' ? -1 : 1;
    E.load(START);
    G = { mode: 'ai', level, colorChoice, myColor, san: [], uci: [], lastMove: null, over: null, thinking: false };
    saveAI();
    showGame();
    if (myColor === -1) aiTurn();
  }
  function resumeAI() {
    const s = store.get(AI_KEY);
    if (!s) return;
    E.load(START);
    G = { mode: 'ai', level: s.level, colorChoice: s.colorChoice, myColor: s.myColor, san: [], uci: [], lastMove: null, over: null, thinking: false };
    for (const u of s.moves) { const m = E.findUci(u); if (!m) break; G.san.push(E.san(m)); G.uci.push(u); E.play(m); G.lastMove = { from: m.from, to: m.to }; }
    showGame();
    if (E.side !== G.myColor && !E.status().over) aiTurn();
  }
  function saveAI() {
    store.set(AI_KEY, { level: G.level, colorChoice: G.colorChoice, myColor: G.myColor, moves: G.uci, over: !!G.over });
  }
  async function aiTurn() {
    const token = ++aiToken;
    G.thinking = true; render();
    const started = Date.now();
    const u = await askAI(E.fen(), LEVELS[G.level]);
    if (Date.now() - started < 350) await sleep(350 - (Date.now() - started));   // a beat so the reply is visible
    if (token !== aiToken || !G || G.mode !== 'ai') return;
    G.thinking = false;
    const m = u && E.findUci(u);
    if (m) applyMove(m); else render();
    saveAI();
  }
  function undo() {
    if (!G.san.length) return;
    aiToken++; G.thinking = false; G.over = null;
    const pop = () => { E.takeBack(); G.san.pop(); G.uci.pop(); };
    pop();
    while (E.side !== G.myColor && G.san.length) pop();
    G.lastMove = null;
    if (G.uci.length) { const u = G.uci[G.uci.length - 1]; G.lastMove = { from: E.sqFrom(u.slice(0, 2)), to: E.sqFrom(u.slice(2, 4)) }; }
    selected = -1; targets = [];
    saveAI();
    render();
    if (E.side !== G.myColor) aiTurn();
  }

  // ---------- online ----------
  const ON = { ready: false, db: null, user: null, room: null, myId: null, myPeer: null, canWrite: null, peers: [], seeking: false, waitingId: null, unsubWait: null, unsubLobby: null };
  const tabId = 't' + Math.random().toString(36).slice(2, 10);
  const newId = () => Array.from(crypto.getRandomValues(new Uint8Array(10)), (b) => 'abcdefghijklmnopqrstuvwxyz0123456789'[b % 36]).join('');

  const loadScript = (src) => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  // Firestore wrapped so the shared online code can address it with the same paths as claude.ai's db
  function fsDb(fs) {
    return { doc: (p) => { const [c, id] = p.split('/'); return c === 'games' ? fs.collection('chessGames').doc(id) : fs.collection('chessLobby').doc('main'); } };
  }
  async function initFirebase() {
    ON.kind = 'firebase';
    try {
      for (const f of ['firebase-app-compat.js', 'firebase-auth-compat.js', 'firebase-firestore-compat.js']) await loadScript(FB_SDK + f);
      const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(FIREBASE);
      const cred = await app.auth().signInAnonymously();
      ON.fs = app.firestore();
      ON.db = fsDb(ON.fs);
      ON.myId = cred.user.uid;
      ON.myPeer = tabId;
      ON.fs.collection('chessLobby').doc('main').onSnapshot((s) => { ON.lobbyWaiting = s.exists ? s.data().waiting : null; renderOnlineMenu(); }, () => {});
    } catch (e) {
      ON.fbError = true;
    }
  }
  async function initOnline() {
    if (!(window.claude && window.claude.use)) {
      await initFirebase();
      ON.ready = true;
      renderOnlineMenu();
      return checkRejoin();
    }
    ON.kind = 'claude';
    const use = (n) => (window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
    const [db, user, room] = await Promise.all([use('db'), use('user'), use('room')]);
    ON.db = db; ON.user = user; ON.room = room;
    if (user) {
      ON.myId = await user.id();
      ON.canWrite = await user.can('data.write');
    }
    if (room) {
      room.onPeers((ch) => {
        ON.peers = ch.peers;
        const me = ch.peers.find((p) => p.sameTab);
        if (me) ON.myPeer = me.peer;
        renderOnlineMenu();
      }, () => { ON.room = null; renderOnlineMenu(); });
    }
    if (!ON.myPeer) ON.myPeer = tabId;
    ON.ready = true;
    renderOnlineMenu();
    return checkRejoin();
  }
  // come back to a game in progress after a reload
  async function checkRejoin() {
    const saved = store.get(ONLINE_KEY);
    if (saved && onlineUsable()) {
      const snap = await ON.db.doc('games/' + saved.gameId).get().catch(() => null);
      if (snap && snap.exists && snap.data().status === 'playing') $('#rejoinBtn').hidden = false;
      else store.del(ONLINE_KEY);
    }
  }
  const onlineUsable = () => !!(ON.db && ON.myId && ON.canWrite !== false);
  function renderOnlineMenu() {
    if ($('#menu').hidden) return;
    const notice = $('#onlineNotice');
    if (!ON.ready) return;
    if (ON.kind === 'firebase') {
      const w = ON.lobbyWaiting;
      const someone = w && w.uid !== ON.myId && Date.now() - (w.at || 0) < WAIT_ALIVE_MS;
      $('#liveLine').hidden = !onlineUsable() || !someone;
      $('#liveText').textContent = '지금 1명이 상대를 기다리고 있어요';
    } else {
      const live = ON.room ? ON.peers.length : 0;
      const waiting = ON.room ? ON.peers.filter((p) => !p.sameTab && p.presence && p.presence.seeking).length : 0;
      $('#liveLine').hidden = !ON.room || !onlineUsable();
      $('#liveText').textContent = `지금 ${live}명이 체스 페이지를 보고 있어요` + (waiting ? ` · ${waiting}명이 상대를 기다리는 중` : '');
    }
    if (ON.fbError) {
      notice.hidden = false;
      notice.textContent = '온라인 서버에 연결하지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.';
    } else if (!ON.db || !ON.myId) {
      notice.hidden = false;
      notice.textContent = LOCAL
        ? '온라인 대전은 claude.ai에 올린 체스 페이지에서만 할 수 있어요. 여기서는 컴퓨터와 대전해 보세요.'
        : '온라인 대전은 claude.ai에 로그인한 상태로 이 페이지를 열어야 할 수 있어요.';
    } else if (ON.canWrite === false) {
      notice.hidden = false;
      notice.textContent = '이 링크로는 대국을 저장할 권한이 없어요. 페이지 주인에게 "참여자" 이상으로 공유해 달라고 해 주세요.';
    } else notice.hidden = true;
    $('#onlineIdle').hidden = !onlineUsable() || ON.seeking;
    $('#onlineSearching').hidden = !ON.seeking;
  }

  const lobby = () => ON.db.doc('chess/lobby');
  function waitingAlive(w) {
    if (!w || !w.gameId) return false;
    if (w.peer === ON.myPeer) return false;
    if (ON.room && ON.peers.length) return ON.peers.some((p) => p.peer === w.peer && p.presence && p.presence.seeking === w.gameId);
    return Date.now() - (w.at || 0) < 120000;
  }
  async function withLobbyLease(fn) {
    for (let i = 0; i < 15; i++) {
      const r = await lobby().acquire({ holder: tabId, ttlMs: 6000 }).catch(() => ({ acquired: false }));
      if (r.acquired) return fn();
      await sleep(300 + Math.random() * 500);
    }
    throw new Error('busy');
  }

  async function findMatch() {
    if (!onlineUsable() || ON.seeking) return;
    ON.seeking = true;
    $('#searchText').textContent = '상대를 찾는 중…';
    renderOnlineMenu();
    // wait briefly for our live-presence label so others can see we are really here
    for (let i = 0; i < 30 && ON.room && ON.myPeer === tabId; i++) await sleep(100);
    if (ON.kind === 'firebase') return fbFindMatch();
    try {
      await withLobbyLease(matchStep);
    } catch (e) {
      ON.seeking = false; renderOnlineMenu();
      toast('지금은 매칭이 어려워요. 잠시 뒤 다시 눌러 주세요.');
    }
  }
  // Inside the lobby lease: join someone who is waiting, or become the one who waits.
  async function matchStep() {
    if (!ON.seeking) return;
    const snap = await lobby().get();
    const w = snap.exists ? snap.data().waiting : null;
    if (w && w.gameId === ON.waitingId) return;            // still our own slot
    if (waitingAlive(w)) {
      const ref = ON.db.doc('games/' + w.gameId);
      const g = await ref.get();
      if (g.exists && g.data().status === 'waiting') {
        await lobby().set({ waiting: null });
        const seat = g.data().white ? 'black' : 'white';
        await ref.update({ [seat]: ON.myId, [seat + 'Peer']: ON.myPeer, status: 'playing', startedAt: Date.now() });
        await dropOwnWaiting();
        return enterOnline(w.gameId, seat === 'white' ? 1 : -1);
      }
    }
    if (ON.waitingId) {                                      // our slot was overwritten: post it again
      await lobby().set({ waiting: { gameId: ON.waitingId, peer: ON.myPeer, at: Date.now() } });
      return;
    }
    const gameId = newId(), seat = Math.random() < 0.5 ? 'white' : 'black';
    if (ON.room) await ON.room.presence({ seeking: gameId }).catch(() => {});
    await ON.db.doc('games/' + gameId).set({
      white: seat === 'white' ? ON.myId : null, black: seat === 'black' ? ON.myId : null,
      whitePeer: seat === 'white' ? ON.myPeer : null, blackPeer: seat === 'black' ? ON.myPeer : null,
      status: 'waiting', moves: [], drawOffer: null, result: null, reason: null, createdAt: Date.now(),
    });
    await lobby().set({ waiting: { gameId, peer: ON.myPeer, at: Date.now() } });
    ON.waitingId = gameId; ON.waitingSeat = seat === 'white' ? 1 : -1;
    $('#searchText').textContent = '상대를 기다리는 중… 다른 기기에서 "상대 찾기"를 누르면 바로 시작돼요';
    ON.unsubWait = ON.db.doc('games/' + gameId).onSnapshot((s) => {
      const d = s.exists ? s.data() : null;
      if (d && d.status === 'playing' && ON.waitingId === gameId) {
        const color = seat === 'white' ? 1 : -1;
        stopWaiting(false);
        enterOnline(gameId, color);
      }
    }, () => {});
    // if someone else takes the lobby slot, try to pair with them instead
    let first = true;
    ON.unsubLobby = lobby().onSnapshot((s) => {
      if (first) { first = false; return; }
      const lw = s.exists ? s.data().waiting : null;
      if (ON.seeking && ON.waitingId && (!lw || lw.gameId !== ON.waitingId)) {
        setTimeout(() => { if (ON.seeking) withLobbyLease(matchStep).catch(() => {}); }, 300 + Math.random() * 400);
      }
    }, () => {});
  }
  async function dropOwnWaiting() {
    if (!ON.waitingId) return;
    const id = ON.waitingId;
    stopWaiting(true);
    await ON.db.doc('games/' + id).delete().catch(() => {});
  }
  function stopWaiting(clearPresence) {
    if (ON.unsubWait) ON.unsubWait();
    if (ON.unsubLobby) ON.unsubLobby();
    ON.unsubWait = ON.unsubLobby = null;
    ON.waitingId = null;
    ON.seeking = false;
    if (clearPresence && ON.room) ON.room.presence({ seeking: null }).catch(() => {});
  }
  // Firebase: one transaction either takes the seat in a live waiting game or opens a new one.
  async function fbFindMatch() {
    const fs = ON.fs, lobbyRef = fs.collection('chessLobby').doc('main');
    let out = null;
    try {
      await fs.runTransaction(async (tx) => {
        out = null;
        const l = await tx.get(lobbyRef);
        const w = l.exists ? l.data().waiting : null;
        if (w && w.gameId && w.uid !== ON.myId && Date.now() - (w.at || 0) < WAIT_ALIVE_MS) {
          const gref = fs.collection('chessGames').doc(w.gameId);
          const g = await tx.get(gref);
          if (g.exists && g.data().status === 'waiting') {
            const seat = g.data().white ? 'black' : 'white';
            tx.update(gref, { [seat]: ON.myId, status: 'playing', startedAt: Date.now() });
            tx.set(lobbyRef, { waiting: null });
            out = { join: w.gameId, color: seat === 'white' ? 1 : -1 };
            return;
          }
        }
        const gameId = newId(), seat = Math.random() < 0.5 ? 'white' : 'black';
        tx.set(fs.collection('chessGames').doc(gameId), {
          white: seat === 'white' ? ON.myId : null, black: seat === 'black' ? ON.myId : null,
          status: 'waiting', moves: [], drawOffer: null, result: null, reason: null, createdAt: Date.now(), ping: {},
        });
        tx.set(lobbyRef, { waiting: { gameId, uid: ON.myId, at: Date.now() } });
        out = { wait: gameId, color: seat === 'white' ? 1 : -1 };
      });
    } catch (e) {
      ON.seeking = false; renderOnlineMenu();
      return toast('지금은 매칭이 어려워요. 잠시 뒤 다시 눌러 주세요.');
    }
    if (!ON.seeking && out && out.wait) { fbCancel(out.wait); return; }
    if (out.join) { ON.seeking = false; return enterOnline(out.join, out.color); }
    const gameId = out.wait;
    ON.waitingId = gameId; ON.waitingSeat = out.color;
    $('#searchText').textContent = '상대를 기다리는 중… 다른 기기에서 "상대 찾기"를 누르면 바로 시작돼요';
    ON.unsubWait = fs.collection('chessGames').doc(gameId).onSnapshot((s) => {
      const d = s.exists ? s.data() : null;
      if (d && d.status === 'playing' && ON.waitingId === gameId) { clearInterval(ON.waitBeat); stopWaiting(false); enterOnline(gameId, out.color); }
    }, () => {});
    // keep our lobby slot marked as alive; reclaim it if someone else's stale entry replaced it
    clearInterval(ON.waitBeat);
    ON.waitBeat = setInterval(() => {
      if (!ON.seeking || ON.waitingId !== gameId) return clearInterval(ON.waitBeat);
      fs.runTransaction(async (tx) => {
        const l = await tx.get(lobbyRef);
        const w = l.exists ? l.data().waiting : null;
        if (!w || w.gameId === gameId || Date.now() - (w.at || 0) >= WAIT_ALIVE_MS) tx.set(lobbyRef, { waiting: { gameId, uid: ON.myId, at: Date.now() } });
      }).catch(() => {});
    }, 15000);
  }
  async function fbCancel(id) {
    const fs = ON.fs, lobbyRef = fs.collection('chessLobby').doc('main'), gref = fs.collection('chessGames').doc(id);
    clearInterval(ON.waitBeat);
    let joined = false;
    try {
      await fs.runTransaction(async (tx) => {
        const l = await tx.get(lobbyRef), g = await tx.get(gref);
        joined = g.exists && g.data().status === 'playing';
        if (joined) return;
        if (l.exists && l.data().waiting && l.data().waiting.gameId === id) tx.set(lobbyRef, { waiting: null });
        if (g.exists) tx.delete(gref);
      });
    } catch (e) {}
    return joined;
  }
  async function cancelSearch() {
    if (ON.kind === 'firebase') {
      const id = ON.waitingId, seat = ON.waitingSeat;
      ON.seeking = false; renderOnlineMenu();
      if (!id) return;
      const joined = await fbCancel(id);
      stopWaiting(false);
      if (joined) enterOnline(id, seat);
      return renderOnlineMenu();
    }
    const id = ON.waitingId;
    ON.seeking = false;
    renderOnlineMenu();
    if (!id) return;
    try {
      await withLobbyLease(async () => {
        const g = await ON.db.doc('games/' + id).get();
        if (g.exists && g.data().status === 'playing') {           // someone joined at the last moment
          const seat = ON.waitingSeat;
          stopWaiting(true);
          return enterOnline(id, seat);
        }
        const l = await lobby().get();
        if (l.exists && l.data().waiting && l.data().waiting.gameId === id) await lobby().set({ waiting: null });
        await dropOwnWaiting();
      });
    } catch (e) { stopWaiting(true); }
    renderOnlineMenu();
  }

  let gameUnsub = null, gameRoom = null;
  async function enterOnline(gameId, color) {
    if (ON.room) ON.room.presence({ seeking: null, playing: true }).catch(() => {});
    store.set(ONLINE_KEY, { gameId, color });
    E.load(START);
    G = { mode: 'online', gameId, myColor: color, san: [], uci: [], lastMove: null, over: null, thinking: false, status: 'playing', drawOffer: null, opponentOnline: null, opponentGoneSince: 0 };
    showGame();
    const ref = ON.db.doc('games/' + gameId);
    if (gameUnsub) gameUnsub();
    gameUnsub = ref.onSnapshot((s) => syncOnline(s), () => toast('대국 연결이 끊겼어요. 새로고침해 주세요.'));
    clearInterval(ON.ping);
    if (ON.kind === 'firebase') {
      const beat = () => { if (G && G.gameId === gameId && !G.over) ref.update({ ['ping.' + (color === 1 ? 'white' : 'black')]: Date.now() }).catch(() => {}); };
      beat();
      ON.ping = setInterval(beat, PING_MS);
    } else if (ON.room) {
      try {
        gameRoom = await ON.room.join('g-' + gameId);
        gameRoom.presence({ color, id: ON.myId }).catch(() => {});
        gameRoom.onPeers((ch) => {
          if (!G || G.gameId !== gameId) return;
          const here = ch.peers.some((p) => !p.sameTab && p.presence && p.presence.color === -color);
          if (here) { G.opponentOnline = true; G.opponentGoneSince = 0; }
          else if (G.opponentOnline !== false) { G.opponentOnline = false; G.opponentGoneSince = Date.now(); }
          render();
        }, () => {});
      } catch (e) { gameRoom = null; }
    }
  }
  // Firebase has no presence: the opponent counts as here while their heartbeat is fresh
  function fbOpponentCheck() {
    if (!G || G.mode !== 'online' || ON.kind !== 'firebase' || G.over) return;
    const seen = G.oppPing || G.startedAt || 0;
    const here = Date.now() - seen < GONE_MS;
    if (here) { if (G.opponentOnline !== true) { G.opponentOnline = true; G.opponentGoneSince = 0; render(); } }
    else if (G.opponentOnline !== false) { G.opponentOnline = false; G.opponentGoneSince = seen + GONE_MS; render(); }
  }
  setInterval(() => { fbOpponentCheck(); if (G && G.mode === 'online' && G.opponentGoneSince && !G.over) renderActions(); }, 5000);

  async function syncOnline(s) {
    if (!G || G.mode !== 'online') return;
    if (!s.exists) { toast('이 대국은 더 이상 없어요.'); store.del(ONLINE_KEY); return showMenu(); }
    const d = s.data();
    G.whiteId = d.white; G.blackId = d.black;
    if (ON.kind === 'firebase') {
      G.oppPing = d.ping ? d.ping[G.myColor === 1 ? 'black' : 'white'] || 0 : 0;
      G.startedAt = G.startedAt || d.startedAt || Date.now();
      fbOpponentCheck();
    }
    G.status = d.status === 'over' ? 'over' : d.status;
    G.drawOffer = d.drawOffer === 'white' ? 1 : d.drawOffer === 'black' ? -1 : null;
    const moves = Array.isArray(d.moves) ? d.moves : [];
    let applied = false;
    for (let i = G.uci.length; i < moves.length; i++) {
      const m = E.findUci(moves[i]);
      if (!m) break;
      applyMove(m);
      applied = true;
    }
    if (d.status === 'over' && d.result) G.over = { result: d.result, reason: d.reason };
    if (G.over) store.del(ONLINE_KEY);
    if (ON.user) {
      const ids = [d.white, d.black].filter(Boolean);
      ON.user.profiles(ids).then((ps) => { profiles = ps; render(); });
    }
    if (!applied) render();
  }
  async function writeGame(patch) {
    const ref = ON.db.doc('games/' + G.gameId);
    for (let i = 0; i < 2; i++) {
      try { await ref.update(patch); return true; }
      catch (e) { if (e && e.code === 'unavailable' && i === 0) { await sleep(500 + Math.random() * 500); continue; } toast('수를 보내지 못했어요. 연결을 확인해 주세요.'); return false; }
    }
    return false;
  }
  function pushOnline() {
    const patch = { moves: G.uci.slice(), drawOffer: null, updatedAt: Date.now() };
    if (G.over) Object.assign(patch, { status: 'over', result: G.over.result, reason: G.over.reason });
    writeGame(patch);
  }
  function resignOnline() {
    const result = G.myColor === 1 ? '0-1' : '1-0';
    G.over = { result, reason: 'resign' };
    writeGame({ status: 'over', result, reason: 'resign', drawOffer: null });
    render();
  }
  function claimAbandon() {
    const result = G.myColor === 1 ? '1-0' : '0-1';
    G.over = { result, reason: 'abandon' };
    writeGame({ status: 'over', result, reason: 'abandon', drawOffer: null });
    render();
  }
  function offerDraw() {
    writeGame({ drawOffer: G.myColor === 1 ? 'white' : 'black' });
    toast('무승부를 제안했어요');
  }
  function renderOffer() {
    const el = $('#offer');
    if (!G || G.mode !== 'online' || G.over || !G.drawOffer || G.drawOffer === G.myColor) { el.hidden = true; return; }
    el.hidden = false;
    el.innerHTML = '<span>상대가 무승부를 제안했어요</span>';
    const yes = document.createElement('button'); yes.className = 'btn primary'; yes.type = 'button'; yes.textContent = '받기';
    yes.addEventListener('click', () => { G.over = { result: '1/2-1/2', reason: 'agreed' }; writeGame({ status: 'over', result: '1/2-1/2', reason: 'agreed', drawOffer: null }); render(); });
    const no = document.createElement('button'); no.className = 'btn'; no.type = 'button'; no.textContent = '거절';
    no.addEventListener('click', () => writeGame({ drawOffer: null }));
    el.append(yes, no);
  }
  function leaveOnline() {
    clearInterval(ON.ping);
    if (gameUnsub) gameUnsub();
    gameUnsub = null;
    if (gameRoom) gameRoom.leave().catch(() => {});
    gameRoom = null;
    if (ON.room) ON.room.presence({ playing: null }).catch(() => {});
    if (G && G.over) store.del(ONLINE_KEY);
    showMenu();
  }
  async function rejoin() {
    const s = store.get(ONLINE_KEY);
    if (!s) return;
    $('#rejoinBtn').hidden = true;
    enterOnline(s.gameId, s.color);
  }

  // ---------- menu wiring ----------
  const segValue = (id) => $(`#${id} [aria-pressed="true"]`).dataset.v;
  for (const id of ['levelSeg', 'colorSeg']) {
    $('#' + id).addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      $('#' + id).querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    });
  }
  $('#aiStart').addEventListener('click', () => startAI(segValue('levelSeg'), segValue('colorSeg')));
  $('#aiResume').addEventListener('click', resumeAI);
  $('#findBtn').addEventListener('click', findMatch);
  $('#cancelBtn').addEventListener('click', cancelSearch);
  $('#rejoinBtn').addEventListener('click', rejoin);
  $('#menuBtn').addEventListener('click', () => {
    if (G && G.mode === 'online' && !G.over) { toast('대국 중이에요. 기권하거나 대국이 끝나면 나갈 수 있어요.'); return; }
    if (G && G.mode === 'online') return leaveOnline();
    showMenu();
  });
  $('#resAgain').addEventListener('click', () => {
    if (G.mode === 'ai') startAI(G.level, G.colorChoice);
    else { leaveOnline(); findMatch(); }
  });
  $('#resView').addEventListener('click', () => { viewingResult = true; render(); });
  addEventListener('resize', () => { if (G) render(); });
  addEventListener('pagehide', () => { if (ON.seeking) cancelSearch(); });

  showMenu();
  initOnline();
})();
</script>
</body>
</html>
